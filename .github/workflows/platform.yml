name: Platform

# Checks for the hybrid platform (docs/platform/): the Rust API and worker, the web app and
# shared packages, and the Android app. The upstream engine keeps its own gate in ci.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust (forge-api, forge-worker)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge-ci-only
          POSTGRES_DB: forge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CRAFT_ANYTHING_NO_KEYCHAIN: "1"
      # Database tests create a fresh database each; REQUIRE turns a skip into a failure here.
      FORGE_TEST_DATABASE_URL: postgres://forge:forge-ci-only@127.0.0.1:5432/forge
      FORGE_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p forge-api -p forge-worker --check
      - run: cargo clippy -p forge-api -p forge-worker --all-targets -- -D warnings
      - run: cargo test -p forge-api -p forge-worker
      - run: cargo xtask layers
      - run: cargo xtask locks
      - name: Tool inventory is up to date
        run: |
          cargo run -q -p forge-worker -- catalog > "$RUNNER_TEMP/tools.json"
          python3 scripts/tool-inventory/render.py "$RUNNER_TEMP/tools.json"
          git diff --exit-code -- docs/platform/03-tool-inventory.md docs/platform/tool-inventory.json

  web:
    name: Web and packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Web end-to-end (API + PostgreSQL + Chromium)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge-ci-only
          POSTGRES_DB: forge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: "1"
      FORGE_E2E_DATABASE_URL: postgres://forge:forge-ci-only@127.0.0.1:5432/forge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p forge-api
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forge/web exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @forge/web e2e
      # The Android app's HTTP client against the same running API (register, projects, WebView hand-over).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android client against the live API
        run: |
          FORGE_API_ADDR=127.0.0.1:18091 FORGE_DATABASE_URL="$FORGE_E2E_DATABASE_URL" FORGE_TOKEN_KEY="$(openssl rand -base64 32)" FORGE_COOKIE_SECURE=false ./target/debug/forge-api &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18091/readyz && break; sleep 1; done
          cd apps/android && FORGE_LIVE_API_URL=http://127.0.0.1:18091 ./gradlew --no-daemon testDebugUnitTest --tests '*LiveApiTest*'
          grep -q 'skipped="0"' app/build/test-results/testDebugUnitTest/TEST-com.tophunt.forge.data.LiveApiTest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  android:
    name: Android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # ubuntu-24.04 runners ship the Android SDK (ANDROID_HOME) with accepted licences; AGP adds
      # any missing platform itself. android-actions/setup-android@v3 failed there (no 'tools' package).
      - uses: gradle/actions/setup-gradle@v4
      # Unit, Robolectric Compose UI and WebView bridge security tests; release-only checks run in testReleaseUnitTest.
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
