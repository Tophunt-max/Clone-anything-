name: Platform

# Checks for the hybrid platform (docs/platform/): the Rust API and worker, the web app and
# shared packages, and the Android app. The upstream engine keeps its own gate in ci.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust (forge-api, forge-worker)
    runs-on: ubuntu-24.04
    env:
      CRAFT_ANYTHING_NO_KEYCHAIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p forge-api -p forge-worker --check
      - run: cargo clippy -p forge-api -p forge-worker --all-targets -- -D warnings
      - run: cargo test -p forge-api -p forge-worker
      - run: cargo xtask layers
      - run: cargo xtask locks
      - name: Tool inventory is up to date
        run: |
          cargo run -q -p forge-worker -- catalog > "$RUNNER_TEMP/tools.json"
          python3 scripts/tool-inventory/render.py "$RUNNER_TEMP/tools.json"
          git diff --exit-code -- docs/platform/03-tool-inventory.md docs/platform/tool-inventory.json

  web:
    name: Web and packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  android:
    name: Android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
